[package]
name = "aranya-web-ui"
version = "0.1.0"
edition = "2021"
description = "Web UI for Aranya management"

# Specify the binary target
[[bin]]
name = "aranya-web-ui"
path = "src/main.rs"

[dependencies]
actix-web = "4.3.1"
actix-files = "0.6.2"
awc = "3.1.1" # Actix web client for proxying requests
env_logger = "0.10.0"
log = "0.4.19"
url = "2.4.0" # For URL parsing 